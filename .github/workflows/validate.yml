name: Validate

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a new HACS or hassfest rule shows up even when nothing is pushed.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the Home Assistant test harness
        run: pip install -r requirements_test.txt
      - name: Run the tests
        run: pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
